    <style>
        .bg-header-pink { background-color: #f3e5e9; }
        .bg-yes-blue { background-color: #e6f3ff; }
        .bg-no-pink { background-color: #ffeef2; }
        .border-gray-custom { border-color: #333; }
        
        /* 模拟参考图中的圆形单选框样式 */
        .custom-radio {
            width: 24px;
            height: 24px;
            border: 2px solid #999;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-radio.selected {
            border-color: #4A90E2;
            background-color: #4A90E2;
            box-shadow: inset 0 0 0 4px white;
        }
        .custom-radio:hover {
            border-color: #666;
        }
        
        table { border-collapse: collapse; }
        th, td { border: 1px solid #333; }
    </style>
</head>

    <div id="app" class="max-w-4xl mx-auto px-4">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-800">性格適性検査</h1>
            <p class="mt-2 text-gray-600">各グループの質問に対し、自分に当てはまるもの（YES）と当てはまらないもの（NO）を1つずつ選んでください。</p>
        </header>

        <div v-for="(group, gIndex) in groups" :key="gIndex" class="mb-12 bg-white shadow-lg rounded-lg overflow-hidden">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-header-pink text-gray-700 font-bold">

                        <th class="p-4 w-12"></th>
                        <th class="p-4 text-center w-20 bg-yes-blue">YES</th>
                        <th class="p-4 text-center w-20 bg-no-pink">NO</th>
                        <th class="p-4">▼ ・ ・【質問項目】</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, iIndex) in group.items" :key="iIndex" class="hover:bg-gray-50">
                        <!-- 第一行显示组号，合并 4 行 -->
                        <td v-if="iIndex === 0" rowspan="4" class="text-center text-4xl font-bold text-gray-400 bg-header-pink border-r border-gray-custom">
                            {{ group.id }}
                        </td>
                        <td class="text-center font-bold border-l border-gray-custom">{{ item.label }}</td>
                        <td class="text-center bg-yes-blue cursor-pointer" @click="select(gIndex, iIndex, 'yes')">
                            <div class="custom-radio" :class="{ 'selected': answers[gIndex].yes === iIndex }"></div>
                        </td>
                        <td class="text-center bg-no-pink cursor-pointer" @click="select(gIndex, iIndex, 'no')">
                            <div class="custom-radio" :class="{ 'selected': answers[gIndex].no === iIndex }"></div>
                        </td>
                        <td class="p-3">{{ item.text }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-center mt-10 mb-20">
            <button @click="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transition duration-300">
                結果を表示する
            </button>
        </div>

        <!-- 结果弹窗 -->

                <p class="mb-6 text-gray-600">お疲れ様でした！すべての回答が記録されました。実際の診断ロジックは用途に合わせて組み込むことが可能です。</p>
                <button @click="showResult = false" class="w-full bg-gray-800 text-white py-2 rounded-lg hover:bg-gray-900">闭じる</button>
            </div>
        </div>
    </div>

                const groups = rawData.map((items, index) => ({
                    id: index + 1,
                    items: items.map((text, i) => ({
                        label: String.fromCharCode(65 + i), // A, B, C, D
                        text: text
                    }))
                }));

                // 初始化答案：每一组有一个 yes 索引和一个 no 索引
                const answers = reactive(groups.map(() => ({ yes: null, no: null })));

                const select = (gIndex, iIndex, type) => {
                    const otherType = type === 'yes' ? 'no' : 'yes';
                    
                    // 如果该行已经在另一列被选中，则取消另一列的选择（互斥逻辑：一行不能既是Yes又是No）
                    // 这里的逻辑根据您的要求“每一列能且只能填一个”
                    // 意味着在每一组的 4 行中，YES 列只能选一个，NO 列只能选一个。
                    
                    answers[gIndex][type] = iIndex;
                    
                    // 如果 YES 和 NO 选在了同一行，则清除另一列（可选规则，通常性格测试不允许同一项既是又是）
                    if (answers[gIndex][type] === answers[gIndex][otherType]) {
                        answers[gIndex][otherType] = null;
                    }
                };

                const submit = () => {
                    const incomplete = answers.findIndex(a => a.yes === null || a.no === null);
                    if (incomplete !== -1) {
                        alert(`第 ${incomplete + 1} 组尚未完成。各グループでYESとNOを1つずつ選択してください。`);
                        return;
                    }
                    showResult.value = true;
                    console.log("Collected Answers:", JSON.parse(JSON.stringify(answers)));
                };

                return { groups, answers, select, submit, showResult };

        }).mount('#app');

</body>
</html>
